name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      # Minimal for now. Unit tests currently need Kimai's autoloader from a
      # mounted Kimai install; PHPStan and coding standards are not configured yet.
      - run: composer validate --strict --no-check-lock --no-check-publish
