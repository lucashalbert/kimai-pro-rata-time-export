name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      # Minimal for now. Tests, PHPStan and coding standards (spec §57, §58)
      # land alongside the domain logic they check.
      - run: composer validate --strict --no-check-lock --no-check-publish
